<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Button Boxer</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="controls">
        <label hidden>Layout <select id="layout-select"></select></label>
        <label>Key <select id="key-select"></select></label>
        <label>Mode <select id="mode-select"></select></label>
        <label>Level <select id="difficulty-select"></select></label>
        <label>View <select id="view-select"></select></label>
      </div>
      <svg id="mini" class="minimap" aria-label="Whole keyboard"></svg>
    </header>

    <p id="error" class="error" hidden></p>

    <main id="stage" class="stage">
      <svg id="zoom" class="zoom" aria-label="Hand-span view"></svg>
    </main>

    <section class="panel">
      <div id="answer" class="answer" aria-live="polite"></div>
      <p id="hint" class="hint"></p>
      <div id="editor" class="editor" hidden>
        <div class="editor-row">
          <button id="edit-prev" aria-label="Previous button">‹</button>
          <select id="edit-button" aria-label="Button"></select>
          <button id="edit-next" aria-label="Next button">›</button>
        </div>
        <label class="editor-row">
          Size <input id="edit-radius" type="range" min="0.2" max="0.7" step="0.005" />
          <span id="edit-radius-value" class="mono"></span>
        </label>
        <div class="editor-row">
          <button id="edit-radius-all">Size → all</button>
          <button id="edit-reset">Reset</button>
          <button id="edit-copy">Copy JSON</button>
          <button id="edit-download">Download</button>
        </div>
      </div>
      <div id="actions" class="actions">
        <button id="mark-wrong" class="mark wrong" aria-label="Wrong">✗</button>
        <span id="progress" class="progress"></span>
        <button id="mark-right" class="mark right" aria-label="Right">✓</button>
        <button id="blitz-toggle" class="blitz-toggle" hidden>Start</button>
      </div>
    </section>
  </body>
</html>
